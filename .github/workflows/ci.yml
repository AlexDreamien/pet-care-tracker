name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Development happens on Windows and deployment is Linux, so both are checked. The
    # native modules (better-sqlite3, sharp, @node-rs/argon2) ship prebuilds for each.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Format check
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build the front end
        run: npm run build

  end-to-end:
    # Drives the built application in a real browser: seeds a household, walks six screens
    # and fails on any console error. This is the job that catches a screen which throws
    # only when rendered.
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Start the application
        run: |
          npm run local &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5199/api/v1/health && break
            sleep 1
          done

      - name: Seed and photograph
        run: npm run capture

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/
          if-no-files-found: warn
